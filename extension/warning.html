<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحذير: صفحة تصيد محتملة</title>
    <link rel="stylesheet" href="ui.css">
</head>
<body class="warning">
    <main>
        <img src="icons/icon-128.png" width="72" height="72" alt="">
        <h1>⚠️ وكّفنا هذي الصفحة</h1>
        <p class="lead">الرابط عليه مؤشرات تصيد قوية (<b id="score"></b>%). لا تدخل أي كلمة سر أو رمز أو بيانات بطاقة.</p>
        <p class="url" id="url" dir="ltr"></p>
        <ul id="reasons"></ul>
        <div class="actions">
            <button id="back" class="primary">ارجع للأمان</button>
            <button id="deep">افحصه بالتفصيل بالموقع</button>
        </div>
        <p class="small">متأكد إن الموقع آمن؟ <button id="proceed" class="link">كمّل على مسؤوليتي</button></p>
        <p class="small muted">هذا الفحص صار داخل متصفحك، وما أرسلنا الرابط لأي جهة.</p>
    </main>
    <script src="config.js"></script>
    <script src="warning.js"></script>
</body>
</html>
