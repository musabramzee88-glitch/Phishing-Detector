name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # المشروع بلا مكتبات خارجية، فلا حاجة لـ npm install
      - name: Run test suite
        run: npm test
        env:
          THREAT_FEEDS: "0"
