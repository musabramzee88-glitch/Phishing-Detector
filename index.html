<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة كشف التصيد الإلكتروني | Phishing Detector</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #ffffff;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 16px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 500px;
            width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        h1 { margin-bottom: 10px; font-size: 26px; color: #38bdf8; }
        p { color: #94a3b8; margin-bottom: 30px; font-size: 14px; }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .btn {
            padding: 14px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            transition: 0.3s;
            display: inline-block;
        }
        .btn-web {
            background-color: #2563eb;
            color: white;
        }
        .btn-web:hover { background-color: #1d4ed8; }
        .btn-download {
            background-color: #10b981;
            color: white;
        }
        .btn-download:hover { background-color: #059669; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🛡️ Phishing Detector System</h1>

        <div class="btn-group">

            <!-- زر تحميل تطبيق سطح المكتب -->
            <a href="/downloads/PhishingDetector-App.zip" class="btn btn-download">📥 تحميل تطبيق سطح المكتب (Windows)</a>
        </div>
    </div>

</body>
</html>
